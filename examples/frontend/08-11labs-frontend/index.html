<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ara 11labs Demo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="header card">
        <h1>11labs Voice Reminders</h1>
        <p>Config on the left, chat in the center, one-call action on the right.</p>
      </header>

      <div class="layout">
        <section class="card admin-panel">
          <h2>Admin</h2>
          <div class="field">
            <label for="appId">App ID</label>
            <input id="appId" placeholder="app_..." />
          </div>
          <div class="field">
            <label for="runtimeKey">Runtime Key</label>
            <input id="runtimeKey" placeholder="ak_app_..." />
          </div>
          <div class="field">
            <label for="agentId">Agent ID</label>
            <input id="agentId" placeholder="labs11_voice_ops_assistant" />
          </div>
          <div class="field">
            <label for="toNumber">To Number (E.164)</label>
            <input id="toNumber" placeholder="+14155550123" />
          </div>
          <button id="saveConfig">Save Config</button>
          <div id="adminStatus" class="status-text"></div>
        </section>

        <section class="card chat-panel">
          <h2>Chat</h2>
          <div id="chatMessages" class="chat-messages"></div>
          <form id="chatForm" class="chat-composer">
            <input id="chatInput" placeholder="Ask anything or request a reminder..." />
            <button type="submit">Send</button>
          </form>
        </section>

        <section class="card actions-panel">
          <h2>Call Action</h2>
          <div class="field full">
            <label for="messageText">Reminder Text</label>
            <textarea id="messageText" rows="4" placeholder="Team standup in 10 minutes."></textarea>
          </div>
          <button id="startCall" class="action-btn">
            <span>Start Call</span>
            <span id="indicatorCall" class="indicator idle">Idle</span>
          </button>
          <div id="actionStatus" class="status-text"></div>
          <pre id="result"></pre>
        </section>
      </div>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
